<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="owner-bg" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ecebe3"/>
      <stop offset="1" stop-color="#d8dbd0"/>
    </linearGradient>
    <linearGradient id="owner-orange" x1="300" y1="200" x2="500" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ee7f43"/>
      <stop offset="1" stop-color="#c64d26"/>
    </linearGradient>
    <linearGradient id="owner-forest" x1="250" y1="350" x2="550" y2="550" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1e3b33"/>
      <stop offset="1" stop-color="#10241f"/>
    </linearGradient>
    <pattern id="owner-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" stroke="#bcc2b7" stroke-width="1" stroke-opacity=".4"/>
    </pattern>
  </defs>

  <!-- Background with industrial blueprint grid -->
  <rect width="800" height="600" fill="url(#owner-bg)"/>
  <rect width="800" height="600" fill="url(#owner-grid)"/>

  <!-- Technical border frame -->
  <rect x="24" y="24" width="752" height="552" fill="none" stroke="#bac0b3" stroke-width="1.5" stroke-dasharray="8 6"/>
  
  <!-- Facility / Warehouse backdrop silhouettes -->
  <path d="M60 480h680v30H60z" fill="#ccd1c6"/>
  <path d="M100 240h90v240h-90zM210 280h70v200h-70zM610 220h80v260h-80z" fill="#bcc3b8" opacity=".6"/>
  <line x1="100" y1="300" x2="190" y2="300" stroke="#aab3a7" stroke-width="3"/>
  <line x1="100" y1="360" x2="190" y2="360" stroke="#aab3a7" stroke-width="3"/>
  <line x1="100" y1="420" x2="190" y2="420" stroke="#aab3a7" stroke-width="3"/>

  <!-- Forklift mast in background -->
  <rect x="520" y="160" width="16" height="320" fill="#24302a" opacity=".8"/>
  <rect x="546" y="160" width="14" height="320" fill="#323f38" opacity=".8"/>
  <rect x="515" y="150" width="50" height="14" fill="#1c2521"/>
  <line x1="520" y1="260" x2="560" y2="260" stroke="#c64d26" stroke-width="6"/>

  <!-- Owner Operator Silhouette / Figure in High-Vis vest -->
  <!-- Shadow -->
  <ellipse cx="380" cy="500" rx="140" ry="18" fill="#1b2823" opacity=".2"/>

  <!-- Body / Torso -->
  <path d="M300 480c0-60 25-110 80-110s80 50 80 110H300z" fill="url(#owner-forest)"/>
  
  <!-- Hi-Vis Work Vest (Terracotta / Orange with reflective strips) -->
  <path d="M320 480c0-50 20-95 60-95s60 45 60 95h-22l-8-50h-60l-8 50H320z" fill="url(#owner-orange)"/>
  <!-- Reflective silver strips on vest -->
  <path d="M338 410l12-3h60l12 3-2 18-12-3h-56l-12 3-2-18z" fill="#ffffff" opacity=".85"/>
  <path d="M346 450h68v14h-68z" fill="#ffffff" opacity=".85"/>

  <!-- Head / Neck -->
  <rect x="365" y="325" width="30" height="48" rx="6" fill="#d9aa8a"/>
  <ellipse cx="380" cy="305" rx="38" ry="44" fill="#e2b494"/>
  
  <!-- Safety Hard Hat (Industrial White/Orange) -->
  <path d="M335 292c0-30 20-46 45-46s45 16 45 46H335z" fill="#ffffff"/>
  <path d="M326 290h108c4 0 6 3 3 6l-6 6H329l-6-6c-3-3-1-6 3-6z" fill="#c64d26"/>
  <path d="M372 246h16v30h-16z" fill="#c64d26"/>

  <!-- Clipboard / Sizing Checklist in Hand -->
  <rect x="420" y="400" width="65" height="90" rx="4" fill="#4a3728" transform="rotate(-10 420 400)"/>
  <rect x="425" y="405" width="55" height="80" rx="2" fill="#ffffff" transform="rotate(-10 420 400)"/>
  <rect x="444" y="394" width="22" height="10" rx="2" fill="#bac0b3" transform="rotate(-10 420 400)"/>
  <line x1="432" y1="422" x2="472" y2="415" stroke="#7b8a83" stroke-width="2.5"/>
  <line x1="434" y1="436" x2="474" y2="429" stroke="#7b8a83" stroke-width="2.5"/>
  <line x1="436" y1="450" x2="466" y2="445" stroke="#7b8a83" stroke-width="2.5"/>

  <!-- Stamp Badge Overlay -->
  <g transform="translate(68, 80)">
    <rect width="180" height="42" rx="4" fill="#142d27"/>
    <text x="14" y="26" fill="#f4f3ec" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">OWNER-OPERATED</text>
  </g>
  <g transform="translate(68, 126)">
    <rect width="135" height="26" rx="2" fill="#c8522c"/>
    <text x="10" y="17" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" letter-spacing="1">LOCAL & DIRECT</text>
  </g>
</svg>
