  <rect x="540" y="445" width="72" height="20" fill="#1c2521"/>
  <line x1="560" y1="120" x2="560" y2="420" stroke="#b94320" stroke-width="4"/>
  
  <!-- Carriage & Forks -->
  <rect x="550" y="270" width="60" height="95" fill="#38453e" rx="2"/>
