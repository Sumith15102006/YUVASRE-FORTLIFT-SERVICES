      <stop stop-color="#ebeae1"/>
      <stop offset="1" stop-color="#d6d9ce"/>
    </linearGradient>
    <linearGradient id="org4w" x1="250" y1="180" x2="560" y2="460" gradientUnits="userSpaceOnUse">
